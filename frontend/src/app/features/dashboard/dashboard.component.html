<div class="dashboard-header fade-in">
  <div>
    <h1 class="dashboard-title">Panel de Control 📊</h1>
    <p class="text-muted text-lg mt-xs">Resumen general de usuarios y tareas asignadas.</p>
  </div>
</div>

<div class="stats-grid mt-xl fade-in-up delay-100">
  <div class="card stat-card primary">
    <div class="stat-header">
      <p class="text-muted text-sm font-semibold text-uppercase">Total de Tareas</p>
      <div class="stat-icon-bg primary-bg">📋</div>
    </div>
    <div class="stat-content">
      <p class="stat-value text-primary">12</p>
      <div class="stat-trend neutral"><span>Tareas globales</span></div>
    </div>
  </div>
  
  <div class="card stat-card info">
    <div class="stat-header">
      <p class="text-muted text-sm font-semibold text-uppercase">Total de Usuarios</p>
      <div class="stat-icon-bg info-bg">👥</div>
    </div>
    <div class="stat-content">
      <p class="stat-value text-info">8</p>
      <div class="stat-trend neutral"><span>En la base de datos</span></div>
    </div>
  </div>
</div>

<div class="dashboard-content mt-2xl fade-in-up delay-200">
  <div class="card glass-panel">
    <div class="panel-header">
      <h3>Lista de Tareas (Backend)</h3>
      <a routerLink="/tasks" class="btn btn-ghost btn-sm text-primary">Ir a Tareas</a>
    </div>
    <div class="panel-body">
      <div class="empty-state text-center mt-xl mb-xl">
        <span class="empty-icon">⏳</span>
        <p class="text-muted text-lg mt-md">Esperando conexión (Fase 4)</p>
      </div>
    </div>
  </div>
</div>
