<div class="home-wrap">
  <!-- Nueva sección dividida en 2 columnas -->
  <div class="home-hero-split">
    
    <!-- Texto a la izquierda -->
    <div class="hero-content fade-in-left">
      <h1 class="home-title">
        Domina la cancha con <br />
        <span class="gradient-text">CoachZone</span>
      </h1>
      
      <p class="home-sub text-muted">
        La plataforma definitiva para entrenadores y jugadores. Crea rutinas estructuradas y mantén la comunicación fluida con todo tu equipo en un solo lugar.
      </p>
      
      <div class="home-actions">
        <button (click)="openModal('register')" class="btn btn-primary btn-lg shine-effect">
          <span>Comenzar ahora</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>
        <button (click)="openModal('login')" class="btn btn-ghost btn-lg">Acceder a mi cuenta</button>
      </div>
    </div>

    <!-- Pelota flotante a la derecha -->
    <div class="hero-graphic fade-in-right">
      <div class="ball-wrapper">
        <span class="home-ball">🏀</span>
        <div class="glow"></div>
      </div>

    </div>

  </div> <!-- Fin Split -->
</div>

@if (showAuthModal) {
  <app-auth-modal [initialMode]="authMode" (close)="closeModal()"></app-auth-modal>
}
