<div class="auth-card-content fade-in-up">
  <div class="auth-header text-center">
    <h2>Crear Cuenta</h2>
    <p class="text-muted text-sm mt-xs">Únete a la familia CoachZone</p>
  </div>

  <form class="auth-form mt-lg">
    <!-- Nombres Grid -->
    <div class="form-grid">
      <div class="form-group custom-input-group">
        <label class="custom-label">Nombre</label>
        <div class="input-wrapper">
          <input type="text" class="custom-input no-icon" placeholder="Ej. Michael" />
        </div>
      </div>
      <div class="form-group custom-input-group">
        <label class="custom-label">Apellido</label>
        <div class="input-wrapper">
          <input type="text" class="custom-input no-icon" placeholder="Ej. Jordan" />
        </div>
      </div>
    </div>

    <!-- Usuario -->
    <div class="form-group custom-input-group mt-sm">
      <label class="custom-label">Usuario</label>
      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input type="text" class="custom-input" placeholder="Elige un usuario único" autocomplete="username" />
      </div>
    </div>

    <!-- Contraseña -->
    <div class="form-group custom-input-group mt-sm">
      <label class="custom-label">Contraseña</label>
      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input type="password" class="custom-input" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
      </div>
    </div>



    <button type="submit" class="btn btn-primary btn-full btn-lg mt-md auth-btn">
      Unirme al equipo 🚀
    </button>
  </form>

  <div class="auth-footer mt-lg text-center">
    <p class="text-sm text-muted">
      ¿Ya tienes cuenta? 
      <a routerLink="/login" class="text-primary font-semibold text-hover-underline ml-xs">Iniciar Sesión</a>
    </p>
  </div>
</div>
