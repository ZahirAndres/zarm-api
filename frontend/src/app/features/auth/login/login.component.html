<div class="auth-card-content fade-in-up">
  <div class="auth-header text-center">
    <h2>Iniciar Sesión</h2>
    <p class="text-muted text-sm mt-xs">Ingresa tus credenciales para continuar</p>
  </div>

  <form class="auth-form mt-xl">
    <div class="form-group custom-input-group">
      <label class="custom-label">Usuario</label>
      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input type="text" class="custom-input" placeholder="Ingresa tu usuario" autocomplete="username" />
      </div>
    </div>

    <div class="form-group custom-input-group">
      <div class="label-with-link">
        <label class="custom-label">Contraseña</label>
        <a href="#" class="text-xs text-primary text-hover-underline">¿Olvidaste tu contraseña?</a>
      </div>
      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input type="password" class="custom-input" placeholder="••••••••" autocomplete="current-password" />
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-full btn-lg mt-md auth-btn">
      Entrar a la cancha 🏀
    </button>
  </form>

  <div class="auth-footer mt-xl text-center">
    <p class="text-sm text-muted">
      ¿Nuevo en el equipo? 
      <a routerLink="/register" class="text-primary font-semibold text-hover-underline ml-xs">Crear cuenta</a>
    </p>
  </div>
</div>
